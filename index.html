<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Finder App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4">📚 Book Finder</h1>
    <div class="input-group mb-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Enter book title...">
      <button class="btn btn-primary" onclick="searchBooks()">Search</button>
    </div>
    <div id="bookResults" class="row gy-4"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
